name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Build, unit, integration and e2e tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Panel
        run: make frontend
      - name: Unit tests
        run: make test
      - name: Known vulnerabilities in Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Known vulnerabilities in panel dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Binary
        run: make backend
      - name: Integration tests (network namespaces, as root)
        run: make test-integration
      - name: End-to-end (isolated virtual LAN, as root)
        run: make e2e

  compose:
    name: End-to-end with docker compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install FFmpeg (the test client uses ffprobe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build the image and run the acceptance criteria against it
        run: make e2e-compose
