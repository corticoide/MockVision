# golangci-lint v2: `make lint` locally, and the CI runs the version it
# pins. The standard linters (errcheck, govet, ineffassign, staticcheck,
# unused) plus unparam; closing files and printing are not error-checked.
version: "2"
linters:
  default: standard
  enable:
    - unparam
  settings:
    staticcheck:
      # The defaults, and !(a || b) stays as written when it reads better.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test helpers may take arguments every caller gives alike.
      - path: _test\.go
        linters: [unparam]
