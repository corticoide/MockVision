openapi: 3.1.0
info:
  title: MockVision API
  version: 0.1.0
  description: |
    REST API of a MockVision node, shared by the panel (session cookie) and
    automation (API tokens sent as `Authorization: Bearer mvt_…`). Errors use
    problem+json (RFC 9457). State-changing requests with the session cookie
    must send the `X-MockVision-Request` header; requests with a token need
    not. A token with the read scope may only make GET requests and open the
    WebSocket; tokens are created and revoked from the panel only. Live
    updates come through a single WebSocket at `/api/v1/ws` (see the
    `x-websocket` section).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - session: []
  - token: []
tags:
  - name: auth
  - name: tokens
  - name: audit
  - name: jobs
  - name: node
  - name: profiles
  - name: cameras
  - name: vca
    description: Rules drawn on a camera's picture and the triggers that raise events on them
  - name: assets
  - name: targets
  - name: events
  - name: faults
    description: Failures injected into a camera (D43) and its simulated reboot
  - name: storage
    description: A camera's simulated SD card or NAS share and the recordings of its events (D68, D69)
  - name: diagnostics
    description: What each camera served, its clients, the requests its profile does not know and its log (D79, D92)
  - name: scraper
    description: Devices the user owns or is authorized to capture, read only, compiled into draft profiles (D44, RN-17)

paths:
  /auth/setup:
    post:
      tags: [auth]
      operationId: setup
      summary: Create the first administrator (first run only)
      description: >
        Needs the node's one-time setup code, printed in its log at start-up
        and kept in the `setup-code` file of the data directory until the
        administrator exists. Attempts count against the address's sign-in
        limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201": { description: Created and logged in, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Current user, and the token of a request made with one; 401 carries setup_required on a fresh node
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /node:
    get:
      tags: [node]
      operationId: getNode
      responses:
        "200": { description: Node, content: { application/json: { schema: { $ref: "#/components/schemas/Node" } } } }
  /node/metrics:
    get:
      tags: [node]
      operationId: getNodeMetrics
      responses:
        "200": { description: Metrics, content: { application/json: { schema: { $ref: "#/components/schemas/NodeMetrics" } } } }
  /node/history:
    get:
      tags: [node]
      operationId: getNodeHistory
      summary: Node samples of the last ten minutes, every 2 s
      parameters:
        - { name: since, in: query, description: Unix milliseconds or RFC 3339, schema: { type: string } }
      responses:
        "200":
          description: Samples, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [samples]
                properties:
                  samples: { type: array, items: { $ref: "#/components/schemas/NodeSample" } }
  /settings:
    get:
      tags: [node]
      operationId: getSettings
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    patch:
      tags: [node]
      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "422": { $ref: "#/components/responses/Problem" }

  /packages:
    post:
      tags: [profiles]
      operationId: importPackage
      summary: Import a .mvpkg package or a loose profile.yaml (draft)
      description: |
        The import runs as a job. The call waits up to a minute for it and
        answers with the result; when the job is still queued or running it
        answers 202 with the job, to follow at /jobs/{id}.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: Already installed, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "201": { description: Installed, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "202":
          description: The import goes on as a job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Profile" } }
  /profiles/{vendor}/{model}/versions/{version}:
    parameters:
      - { name: vendor, in: path, required: true, schema: { type: string } }
      - { name: model, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
    get:
      tags: [profiles]
      operationId: getProfile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /profiles/{vendor}/{model}/versions/{version}/actions/{action}:
    parameters:
      - { name: vendor, in: path, required: true, schema: { type: string } }
      - { name: model, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [archive, unarchive] } }
    post:
      tags: [profiles]
      operationId: profileAction
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileDetail" } } } }
  /profiles/{vendor}/{model}/versions/{version}/actions/duplicate:
    parameters:
      - { name: vendor, in: path, required: true, schema: { type: string } }
      - { name: model, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
    post:
      tags: [profiles]
      operationId: duplicateProfile
      summary: Copy a profile version under another ID, to change one that is read only (D19)
      description: The copy is a new unsigned package, imported as any other; export it, edit it and import a new version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: string, description: "vendor/model of the copy" }
                version: { type: string, description: Defaults to 0.1.0 }
                name: { type: string }
      responses:
        "201": { description: The copy, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /profiles/{vendor}/{model}/versions/{version}/export:
    parameters:
      - { name: vendor, in: path, required: true, schema: { type: string } }
      - { name: model, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
    get:
      tags: [profiles]
      operationId: exportProfile
      summary: Download a profile version as a .mvpkg (D22)
      description: The package as it was imported, signature included; a loose profile.yaml comes wrapped in an unsigned package.
      responses:
        "200": { description: The package, content: { application/zip: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /profiles/{vendor}/{model}/versions/{version}/diff/{to}:
    parameters:
      - { name: vendor, in: path, required: true, schema: { type: string } }
      - { name: model, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
      - { name: to, in: path, required: true, schema: { type: string } }
    get:
      tags: [profiles]
      operationId: diffProfile
      summary: What changes from one version of a profile to another (D05)
      responses:
        "200":
          description: The differences
          content:
            application/json:
              schema:
                type: object
                required: [from, to, changes]
                properties:
                  from: { type: string }
                  to: { type: string }
                  changes: { type: array, items: { $ref: "#/components/schemas/ProfileChange" } }
        "404": { $ref: "#/components/responses/Problem" }

  /plugins:
    get:
      tags: [packages]
      operationId: listPlugins
      summary: Installed plugins, the engines they provide and the permissions they ask for (D85, D86)
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Plugin" } }
  /plugins/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [packages]
      operationId: updatePlugin
      summary: Enable a plugin, approving its permissions, or disable it (panel session only)
      description: |
        One version of an engine is enabled at a time: enabling one disables
        the others. An unsigned plugin is enabled only where the settings
        allow unsigned plugins (D84). Running cameras keep the engine they
        started with until they restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Plugin" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /devices:
    get:
      tags: [scraper]
      operationId: listDevices
      summary: Devices registered to capture
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Device" } }
    post:
      tags: [scraper]
      operationId: createDevice
      summary: Register a device to capture (panel session only)
      description: |
        Set `authorized` to confirm you own the device or are allowed to
        capture it; no probe runs until it is set (RN-17). Credentials are
        stored encrypted and never returned (RN-18).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/DeviceInput" } }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /programs:
    get:
      tags: [scraper]
      operationId: listPrograms
      summary: Capture programs, built into the binary or installed as packages
      parameters:
        - { name: vendor, in: query, schema: { type: string } }
        - { name: device, in: query, description: Narrow to what suits this device's detected vendor, schema: { type: string } }
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Program" } }
  /devices/{id}/captures:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [scraper]
      operationId: listCaptures
      responses:
        "200":
          description: Captures of the device, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Capture" } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [scraper]
      operationId: startCapture
      summary: Run a capture program against the device, read-only, as a job (panel session only)
      description: Refused until the device is authorized (RN-17).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [program]
              properties:
                program: { type: string, description: "program id or id@version" }
      responses:
        "201": { description: Capture started, content: { application/json: { schema: { $ref: "#/components/schemas/Capture" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /captures/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [scraper]
      operationId: getCapture
      responses:
        "200": { description: Capture with its recordings, content: { application/json: { schema: { $ref: "#/components/schemas/Capture" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /scraper/actions/discover:
    post:
      tags: [scraper]
      operationId: discover
      summary: Look for cameras on the LAN, read-only (panel session only)
      description: |
        A connect sweep of a private subnet and best-effort multicast
        queries (SSDP, WS-Discovery). Bounded to private, loopback or
        link-local ranges of /22 or smaller, and paced, so it stays on the
        LAN (RN-17).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cidr: { type: string, description: "Subnet to sweep, e.g. 192.168.1.0/24; private ranges only" }
                multicast: { type: boolean }
      responses:
        "200":
          description: Devices found
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Found" } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /devices/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [scraper]
      operationId: getDevice
      responses:
        "200": { description: Device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [scraper]
      operationId: updateDevice
      summary: Edit a device (panel session only)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/DeviceInput" } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [scraper]
      operationId: deleteDevice
      summary: Remove a device and its captures (panel session only)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /devices/{id}/actions/probe:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [scraper]
      operationId: probeDevice
      summary: Look at a device read-only and record what it found (panel session only)
      description: Refused until the device is authorized (RN-17); paced by the node's scrape rate (D72).
      responses:
        "200": { description: Device with its detection, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /trusted-keys:
    get:
      tags: [packages]
      operationId: listTrustedKeys
      summary: Keys whose package signatures the node trusts, official ones first (D83)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TrustedKey" } }
    post:
      tags: [packages]
      operationId: addTrustedKey
      summary: Trust a minisign public key (panel session only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, public_key]
              properties:
                name: { type: string, maxLength: 64 }
                public_key: { type: string, description: The .pub file or its base64 line }
      responses:
        "201": { description: Trusted, content: { application/json: { schema: { $ref: "#/components/schemas/TrustedKey" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /trusted-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [packages]
      operationId: deleteTrustedKey
      summary: Stop trusting a key (panel session only); packages imported before keep their status
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: API tokens of the current user (panel session only)
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Token" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create an API token (panel session only); the secret is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedToken" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke an API token (panel session only)
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Background jobs, newest first (D72, D74)
      parameters:
        - { name: status, in: query, description: A status, active (queued, running, waiting or interrupted) or finished, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [rendition, import, renditions.prepare] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { $ref: "#/components/schemas/JobPage" } } } }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [jobs]
      operationId: createJob
      summary: Start a job; for now renditions.prepare, which encodes what the cameras need
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "202": { description: Queued, or the open job doing the same work, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [jobs]
      operationId: getJob
      summary: A job with its history
      responses:
        "200": { description: Job, content: { application/json: { schema: { $ref: "#/components/schemas/JobDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /jobs/{id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: action, in: path, required: true, schema: { type: string, enum: [cancel, resume, answer] } }
    post:
      tags: [jobs]
      operationId: jobAction
      summary: Cancel a job, resume an interrupted one, or answer its question ({"answer":"<option id>"})
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer: { type: string }
      responses:
        "200": { description: Job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Who changed what, when and from where (kept 90 days)
      parameters:
        - { name: origin, in: query, schema: { type: string, enum: [panel, api, camera, system] } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: token_id, in: query, schema: { type: string } }
        - { name: action, in: query, description: Exact action or prefix, such as camera, schema: { type: string } }
        - { name: since, in: query, description: Unix milliseconds or RFC 3339, schema: { type: string } }
        - { name: until, in: query, description: Unix milliseconds or RFC 3339, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Entries, newest first, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /cameras:
    get:
      tags: [cameras]
      operationId: listCameras
      parameters:
        - { name: q, in: query, description: Text in the name, address, MAC, serial or tags, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: profile, in: query, description: Profile ID or ID@version, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
      responses:
        "200":
          description: Cameras
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Camera" } }
    post:
      tags: [cameras]
      operationId: createCamera
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCamera" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/actions/bulk:
    post:
      tags: [cameras]
      operationId: bulkCameras
      summary: Start, stop, restart, clone or delete several cameras; each gets its own result
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkAction" }
      responses:
        "200": { description: Results, content: { application/json: { schema: { $ref: "#/components/schemas/BulkResult" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [cameras]
      operationId: getCamera
      responses:
        "200": { description: Camera, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [cameras]
      operationId: updateCamera
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCamera" }
      responses:
        "200": { description: Camera, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
    delete:
      tags: [cameras]
      operationId: deleteCamera
      responses:
        "204": { description: Deleted }
  /cameras/{id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart] } }
    post:
      tags: [cameras]
      operationId: cameraAction
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/actions/factory-reset:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [cameras]
      operationId: resetCamera
      description: >
        Restores the camera to its profile (RN-10): parameters, accounts and
        protocols; with scope full, also the profile's factory address. The
        picture is kept. A running camera reboots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [settings, full] }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/actions/clone:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [cameras]
      operationId: cloneCamera
      description: >
        Creates a camera with the same profile, parameters, accounts,
        protocols, picture and targets, with its own ID, serial, MAC and
        address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloneCamera" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/actions/reboot:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [faults]
      operationId: rebootCamera
      description: >
        Reboots a running camera as the real one does (D43): it leaves the
        network and comes back after its boot time, the profile's (30 s
        when it says none) unless seconds is given. Starting or stopping it
        meanwhile ends the wait.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds: { type: integer, minimum: 0, maximum: 600 }
      responses:
        "202": { description: Rebooting, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/actions/upgrade-profile:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [cameras]
      operationId: upgradeCameraProfile
      summary: Move a camera to another version of its profile (D05)
      description: >
        Parameters keep the values someone set when the new version accepts
        them; the rest follow its defaults. Protocols, streams, rules and
        triggers follow what the version has; a running camera restarts.
        With dry_run it only answers the plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                dry_run: { type: boolean }
      responses:
        "200":
          description: The plan, and the camera when applied
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: "#/components/schemas/UpgradePlan" }
                  camera: { $ref: "#/components/schemas/Camera" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/faults:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [faults]
      operationId: listCameraFaults
      description: The camera's faults, those on first, then the last ended ones.
      responses:
        "200":
          description: Faults
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Fault" } }
    post:
      tags: [faults]
      operationId: injectFault
      description: >
        Injects a fault (D43). It applies at once on a running camera, which
        turns degraded; a stopped one gets it as it starts, while it lasts.
        Every fault ends when its duration is over or by hand (RN-14); a
        duration of 0 lasts until ended. A fault of the same kind on the
        same protocol replaces the one in place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaultInput" }
      responses:
        "201": { description: Injected, content: { application/json: { schema: { $ref: "#/components/schemas/Fault" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/faults/{fault}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: fault, in: path, required: true, schema: { type: string } }
    delete:
      tags: [faults]
      operationId: endFault
      responses:
        "204": { description: Ended }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/storage:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [storage]
      operationId: getStorage
      description: Where the camera records, what its model offers, and the state of its card or share.
      responses:
        "200": { description: Storage, content: { application/json: { schema: { $ref: "#/components/schemas/Storage" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [storage]
      operationId: updateStorage
      description: >
        Gives the camera an SD card, a NAS share or neither; fields left out
        stay. A card that is new or grows must fit on the node's disk with
        what the other cards promised (D91, rejected with code disk). Taking
        the card out wipes it, and a smaller card keeps the newest
        recordings that fit. A running camera gets the change at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Storage" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/storage/actions/format:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [storage]
      operationId: formatStorage
      description: Wipes the SD card, as the device's format does; a card out of its slot or read only cannot be formatted.
      responses:
        "200": { description: Formatted, content: { application/json: { schema: { $ref: "#/components/schemas/Storage" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/recordings:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [storage]
      operationId: listRecordings
      description: The newest recordings (200 at most) of the camera's current card or share.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [snapshot, clip] } }
      responses:
        "200":
          description: Recordings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Recording" } }
  /cameras/{id}/recordings/{recording}/download:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: recording, in: path, required: true, schema: { type: string } }
    get:
      tags: [storage]
      operationId: downloadRecording
      description: >
        The recording's file: a JPEG snapshot or an MPEG-TS clip. Those on a
        NAS share are read through the camera, which must be running.
      responses:
        "200":
          description: The file
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            video/mp2t: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/users:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [cameras]
      operationId: setCameraUsers
      description: >
        Replaces the camera's accounts (RN-11: at least one admin). An empty
        password keeps the account's current one. Applied at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users: { type: array, items: { $ref: "#/components/schemas/CameraUserInput" } }
      responses:
        "200": { description: Camera, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/protocols:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [cameras]
      operationId: setCameraProtocols
      description: >
        Enables, disables or moves protocols of the camera's profile (RN-04).
        A running camera applies them when it restarts (RN-09).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocols]
              properties:
                protocols:
                  type: array
                  items:
                    type: object
                    required: [instance]
                    properties:
                      instance: { type: string }
                      enabled: { type: boolean }
                      port: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        "200": { description: Camera, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/streams/{stream}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: stream, in: path, required: true, schema: { type: string } }
    patch:
      tags: [cameras]
      operationId: updateCameraStream
      description: >
        Changes the picture of a stream or its encoding: codec, resolution,
        frame rate, bitrate and GOP, each through the profile parameter bound
        to it. The stream is encoded again and a running camera switches to
        it without restarting; RTSP clients of that stream reconnect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset_id: { type: string }
                codec: { type: string, enum: [h264, h265, mjpeg] }
                resolution: { type: string }
                fps: { type: integer }
                bitrate: { type: integer, description: kbit/s }
                gop: { type: integer, description: Frames between keyframes }
      responses:
        "200": { description: Camera, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [cameras]
      operationId: getCameraStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [status, endpoints, metrics]
                properties:
                  status: { $ref: "#/components/schemas/CameraStatus" }
                  endpoints: { type: array, items: { $ref: "#/components/schemas/Endpoint" } }
                  metrics: { oneOf: [{ $ref: "#/components/schemas/CameraMetrics" }, { type: "null" }] }
  /cameras/{id}/config:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [cameras]
      operationId: getCameraConfig
      responses:
        "200": { description: Parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ParamList" } } } }
    patch:
      tags: [cameras]
      operationId: patchCameraConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: { type: object, additionalProperties: true }
      responses:
        "200": { description: Parameters, content: { application/json: { schema: { $ref: "#/components/schemas/ParamList" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: since, in: query, schema: { type: integer, description: Unix milliseconds, within the last ten minutes } }
      - name: range
        in: query
        description: "A window instead of since: 10m (a sample a second, from memory), 1h and 24h (one every 10 s), 7d (one a minute) (D92)"
        schema: { type: string, enum: [10m, 1h, 24h, 7d] }
    get:
      tags: [cameras]
      operationId: getCameraMetrics
      responses:
        "200":
          description: Samples
          content:
            application/json:
              schema:
                type: object
                required: [samples]
                properties:
                  samples: { type: array, items: { $ref: "#/components/schemas/CameraMetrics" } }
  /cameras/{id}/requests:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Window"
      - name: format
        in: query
        description: Download the window a minute at a time, by client and route, as CSV or JSON
        schema: { type: string, enum: [csv, json] }
    get:
      tags: [diagnostics]
      operationId: getCameraRequests
      summary: What the camera served over a window, by route and client, and a minute at a time
      responses:
        "200":
          description: Requests; with format, the file to download instead
          content:
            application/json: { schema: { $ref: "#/components/schemas/RequestsView" } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/clients:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Window"
    get:
      tags: [diagnostics]
      operationId: getCameraClients
      summary: The camera's clients over a window, the most recent first
      description: |
        For each address: what it asks and how often, its connections and
        how long they last, its errors, refused credentials and requests
        the profile does not know. It diagnoses the equipment under test.
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CameraClient" } }
        "404": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/gaps:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [diagnostics]
      operationId: getCameraGaps
      summary: Requests the camera's profile does not know (D79), the most recent first
      responses:
        "200":
          description: Gaps
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Gap" } }
        "404": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: before, in: query, description: The id the previous page ended at, schema: { type: integer } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
    get:
      tags: [diagnostics]
      operationId: getCameraLogs
      summary: The camera's log, the newest first; what it logged and what the service did with it
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CameraLog" } }
        "404": { $ref: "#/components/responses/Problem" }
  /metrics:
    get:
      tags: [diagnostics]
      operationId: getPrometheusMetrics
      summary: The node's and the cameras' latest metrics, in Prometheus' text format
      description: For a Prometheus server with an API token (Authorization Bearer).
      responses:
        "200": { description: Metrics, content: { text/plain: { schema: { type: string } } } }
  /cameras/{id}/snapshot:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: stream, in: query, description: "main (the default), sub or third", schema: { type: string } }
    get:
      tags: [cameras]
      operationId: getSnapshot
      responses:
        "200": { description: JPEG, content: { image/jpeg: { schema: { type: string, format: binary } } } }
  /cameras/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [events]
      operationId: triggerEvent
      summary: Manual trigger; the camera serializes and delivers the event
      description: >
        The event happens on rule_id, or on the first enabled rule that
        reports its type; without one, on a default line or region. What the
        request leaves out (direction, object, plate, speed) the camera
        generates. 409 when the camera is not running, the rule is disabled
        or the profile's analytics switch turns the type off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualEvent" }
      responses:
        "201": { description: Emitted, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/rules:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [vca]
      operationId: listCameraRules
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Rule" } }
    put:
      tags: [vca]
      operationId: setCameraRules
      description: >
        Replaces the camera's analytics rules (D39); a rule without id is new.
        A running camera applies them at once. 409 when a trigger fires on a
        rule that would go away or stop reporting its events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/RuleInput" } }
      responses:
        "200": { description: Camera, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/triggers:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [vca]
      operationId: listCameraTriggers
      responses:
        "200":
          description: Triggers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Trigger" } }
    put:
      tags: [vca]
      operationId: setCameraTriggers
      description: >
        Replaces the camera's stored triggers (D40); a trigger without id is
        new. A running camera applies them at once: enabled random triggers
        raise events, disabled ones stop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [triggers]
              properties:
                triggers: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/TriggerInput" } }
      responses:
        "200": { description: Camera, content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /cameras/{id}/triggers/{trigger}/actions/fire:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: trigger, in: path, required: true, schema: { type: string } }
    post:
      tags: [vca]
      operationId: fireTrigger
      summary: Emits one event of a stored trigger now, enabled or not
      responses:
        "201": { description: Emitted, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /cameras/{id}/analytics:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [vca]
      operationId: getCameraAnalytics
      summary: What a running camera counted from the events it emitted
      description: >
        Crossings of each line by direction and object class, entries, exits
        and occupancy of each region, events by type, and, with cols and
        rows, a heat map of where objects were. Counts start with the camera
        process or at the last reset.
      parameters:
        - { name: cols, in: query, schema: { type: integer, minimum: 1, maximum: 128 } }
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 72 } }
      responses:
        "200": { description: Counts, content: { application/json: { schema: { $ref: "#/components/schemas/Analytics" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /cameras/{id}/analytics/actions/reset:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [vca]
      operationId: resetCameraAnalytics
      summary: Starts a running camera's counts again from zero
      responses:
        "200": { description: Counts after the reset, content: { application/json: { schema: { $ref: "#/components/schemas/Analytics" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /assets:
    get:
      tags: [assets]
      operationId: listAssets
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Asset" } }
    post:
      tags: [assets]
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /assets/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [assets]
      operationId: deleteAsset
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /assets/{id}/content:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [assets]
      operationId: getAssetContent
      responses:
        "200": { description: Image, content: { image/*: { schema: { type: string, format: binary } } } }

  /targets:
    get:
      tags: [targets]
      operationId: listTargets
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Target" } }
    post:
      tags: [targets]
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Target" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /targets/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [targets]
      operationId: getTarget
      responses:
        "200": { description: Target, content: { application/json: { schema: { $ref: "#/components/schemas/Target" } } } }
    patch:
      tags: [targets]
      operationId: updateTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetInput" }
      responses:
        "200": { description: Target, content: { application/json: { schema: { $ref: "#/components/schemas/Target" } } } }
    delete:
      tags: [targets]
      operationId: deleteTarget
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /targets/{id}/actions/test:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [targets]
      operationId: testTarget
      responses:
        "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/TargetTest" } } } }

  /faults:
    get:
      tags: [faults]
      operationId: listActiveFaults
      description: The faults on in every camera.
      responses:
        "200":
          description: Faults
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Fault" } }

  /events:
    get:
      tags: [events]
      operationId: listEvents
      parameters:
        - { name: camera_id, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: delivery, in: query, description: Only events a target gave up on, schema: { type: string, enum: [failed] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Events, content: { application/json: { schema: { $ref: "#/components/schemas/EventPage" } } } }
  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [events]
      operationId: getEvent
      responses:
        "200": { description: Event, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }

x-websocket:
  path: /api/v1/ws
  description: |
    One read-only connection multiplexed by topic. Send
    {"op":"subscribe","topics":["cameras","events"],"since":{"cameras":41}}
    and receive {"topic","seq","type","at","data"}. Every topic numbers its
    messages; after a reconnection send the last seq seen per topic. When it
    is too old the server answers type "resync" and the client reloads that
    state through REST. Topics: node (metrics), cameras (created, updated,
    deleted, status, faults, storage), camera:<id> (status, config, client, gap, log),
    events (event), profiles (installed), audit (entry), jobs (job: every
    change of a job), job:<id> (event: its history as it grows).

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mv_session
    token:
      type: http
      scheme: bearer
      description: API token created in the panel (Settings, API tokens)
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Window:
      name: window
      in: query
      description: The last hour, day or week; an hour by default
      schema: { type: string, enum: [1h, 24h, 7d], default: 1h }
  responses:
    Problem:
      description: Problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        report: { $ref: "#/components/schemas/ImportReport" }
        setup_required: { type: boolean }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    SetupRequest:
      type: object
      required: [username, password, setup_code]
      properties:
        username: { type: string }
        password: { type: string, minLength: 10 }
        setup_code: { type: string, description: "One-time code from the node's log or its setup-code file; case and spaces are ignored" }
    Me:
      type: object
      required: [user, expires_at]
      properties:
        user:
          type: object
          required: [id, username, role]
          properties:
            id: { type: string }
            username: { type: string }
            role: { type: string }
        expires_at: { type: [string, "null"], format: date-time, description: Null for a token that does not expire }
        token:
          type: object
          required: [id, name, scopes]
          properties:
            id: { type: string }
            name: { type: string }
            scopes: { type: array, items: { type: string, enum: [read, write] } }
    Interface:
      type: object
      required: [name, mac, up, loopback, addrs, default]
      properties:
        name: { type: string }
        mac: { type: string }
        up: { type: boolean }
        loopback: { type: boolean }
        addrs: { type: [array, "null"], items: { type: string } }
        default: { type: boolean }
        gateway: { type: string }
        wireless: { type: boolean, description: "Wi-Fi: macvlan cameras cannot use it; ipvlan ones can (D27)" }
    Bridge:
      type: object
      description: The node's access to its own macvlan cameras (D26).
      required: [enabled]
      properties:
        enabled: { type: boolean }
        interface: { type: string }
        parent: { type: string }
        node_ips: { type: array, items: { type: string }, description: "The node's addresses on the parent the bridge routes from; it is set again when they change" }
        error: { type: string }
    CameraCounts:
      type: object
      required: [total, running, error, by_state]
      properties:
        total: { type: integer }
        running: { type: integer, description: Running and degraded }
        error: { type: integer }
        by_state: { type: object, additionalProperties: { type: integer } }
    Node:
      type: object
      required: [version, runtime, hostname, cpu_count, mem_total, default_interface, default_gateway, parent_interface, interfaces, cameras, panel, started_at]
      properties:
        version: { type: string }
        runtime: { type: string, enum: [netns, local] }
        hostname: { type: string }
        cpu_count: { type: integer }
        mem_total: { type: integer }
        default_interface: { type: string }
        default_gateway: { type: string }
        parent_interface: { type: string, description: The interface cameras attach to by default }
        default_parent: { type: string, description: "What an empty parent interface in the settings means: MOCKVISION_PARENT_IF, else the default route's interface" }
        interfaces: { type: [array, "null"], items: { $ref: "#/components/schemas/Interface" } }
        cameras: { $ref: "#/components/schemas/CameraCounts" }
        panel:
          type: object
          description: Where the panel and the API listen (D63)
          required: [listen, all_interfaces, urls]
          properties:
            listen: { type: string }
            all_interfaces: { type: boolean }
            urls: { type: array, items: { type: string } }
        bridge: { $ref: "#/components/schemas/Bridge" }
        dns: { type: array, items: { type: string }, description: The node's DNS servers, used by cameras that have none }
        started_at: { type: string, format: date-time }
    Settings:
      type: object
      required: [max_cameras, max_ram_percent, max_cpu_percent, parent_interface, events_retention_days, max_jobs, job_step_timeout_seconds]
      properties:
        max_cameras: { type: integer }
        max_ram_percent: { type: number }
        max_cpu_percent: { type: number }
        parent_interface: { type: string }
        events_retention_days: { type: integer }
        max_jobs: { type: integer, minimum: 1, maximum: 16, description: Jobs that run at once (D72) }
        job_step_timeout_seconds: { type: integer, minimum: 10, maximum: 3600, description: Bound of each step of a job (D72) }
        node_bridge: { type: boolean, description: "Let the node reach its macvlan cameras through an extra interface (D26); off by default" }
        allow_unsigned_plugins: { type: boolean, description: "Let an admin enable plugins no trusted key signed (D84); turning it off disables them" }
        scrape_rate_per_second: { type: integer, minimum: 1, maximum: 50, description: "Read-only requests a second the scraper sends a device (D72)" }
    SettingsPatch:
      type: object
      properties:
        max_cameras: { type: integer }
        max_ram_percent: { type: number }
        max_cpu_percent: { type: number }
        parent_interface: { type: string }
        events_retention_days: { type: integer }
        max_jobs: { type: integer }
        job_step_timeout_seconds: { type: integer }
        node_bridge: { type: boolean }
        allow_unsigned_plugins: { type: boolean }
        scrape_rate_per_second: { type: integer }
    NodeMetrics:
      type: object
      required: [at, cpu_percent, cpu_sustained_percent, mem_total, mem_used, net_interface, net_rx_bps, net_tx_bps, cameras, camera_counts, db, limits]
      properties:
        at: { type: string, format: date-time }
        cpu_percent: { type: number }
        cpu_sustained_percent: { type: number }
        mem_total: { type: integer }
        mem_used: { type: integer }
        net_interface: { type: string, description: Interface the cameras hang from }
        net_rx_bps: { type: number, description: Bytes per second received }
        net_tx_bps: { type: number, description: Bytes per second sent }
        cameras: { type: object, additionalProperties: { $ref: "#/components/schemas/CameraMetrics" } }
        camera_counts: { $ref: "#/components/schemas/CameraCounts" }
        db:
          type: object
          required: [write_statements, write_transactions]
          properties:
            write_statements: { type: integer }
            write_transactions: { type: integer }
        limits: { $ref: "#/components/schemas/Settings" }
    NodeSample:
      type: object
      required: [at, cpu_percent, mem_total, mem_used, net_interface, net_rx_bps, net_tx_bps]
      properties:
        at: { type: string, format: date-time }
        cpu_percent: { type: number }
        mem_total: { type: integer }
        mem_used: { type: integer }
        net_interface: { type: string }
        net_rx_bps: { type: number }
        net_tx_bps: { type: number }
    Token:
      type: object
      required: [id, name, prefix, scopes, created_at, expires_at, last_used_at, last_used_ip, expired]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: First characters of the secret, to recognize it }
        scopes: { type: array, items: { type: string, enum: [read, write] } }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        last_used_ip: { type: string }
        expired: { type: boolean }
    TokenInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        scopes: { type: array, items: { type: string, enum: [read, write] }, description: write implies read; none means read }
        expires_in_days: { type: [integer, "null"], minimum: 1, maximum: 3650, description: Null for a token that lasts until revoked }
    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret: { type: string, description: Shown only now; the node keeps its hash }
    AuditEntry:
      type: object
      required: [id, at, actor, origin, origin_ip, token, action, entity, diff]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [user, camera, system] }
            id: { type: string }
            name: { type: string }
        origin: { type: string, enum: [panel, api, camera, system] }
        origin_ip: { type: string }
        token:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        action: { type: string }
        entity:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string }
            id: { type: string }
            name: { type: string }
        diff: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next_cursor: { type: string }
    BulkAction:
      type: object
      required: [action, ids]
      properties:
        action: { type: string, enum: [start, stop, restart, clone, delete] }
        ids: { type: array, items: { type: string }, maxItems: 200 }
        start: { type: boolean, description: Start each copy (clone only) }
    BulkResult:
      type: object
      required: [action, succeeded, failed, results]
      properties:
        action: { type: string }
        succeeded: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [id, ok]
            properties:
              id: { type: string }
              ok: { type: boolean }
              camera: { $ref: "#/components/schemas/Camera" }
              error: { $ref: "#/components/schemas/Problem" }
    Profile:
      type: object
      required: [id, profile_id, version, name, vendor, model, firmware, level, signature_status, archived, camera_count, created_at]
      properties:
        id: { type: string }
        profile_id: { type: string }
        version: { type: string }
        name: { type: string }
        vendor: { type: string }
        model: { type: string }
        firmware: { type: array, items: { type: string } }
        level: { type: string, enum: [draft, documented, captured, verified] }
        signature_status: { type: string, enum: [official, trusted, unsigned, invalid] }
        signer: { type: string, description: The trusted key that signed the package }
        source: { type: string, enum: [upload, catalog, duplicate], description: "catalog: shipped in the binary, read only" }
        extends: { type: string, description: The parent the profile was resolved with, pinned }
        archived: { type: boolean }
        camera_count: { type: integer }
        created_at: { type: string, format: date-time }
        coverage: { type: object, additionalProperties: { type: string } }
    ProfileChange:
      type: object
      required: [section, key, kind]
      properties:
        section: { type: string, enum: [state, streams, engines, routes, events, identity, vca, storage] }
        key: { type: string }
        kind: { type: string, enum: [added, removed, changed] }
        details: { type: array, items: { type: string }, description: "What changed in it, as path: before → after" }
    Device:
      type: object
      required: [id, name, host, ports, has_password, kind, authorized, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string, description: IP address or host name }
        ports: { type: array, items: { type: integer } }
        username: { type: string }
        has_password: { type: boolean }
        port_map: { type: object, additionalProperties: { type: integer }, description: "Logical program port to the device's actual port" }
        kind: { type: string, enum: [real, simulated], description: "simulated when the host is one of this node's cameras (D75)" }
        authorized: { type: boolean }
        detected: { $ref: "#/components/schemas/Detected" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceInput:
      type: object
      required: [name, host, authorized]
      properties:
        name: { type: string }
        host: { type: string }
        ports: { type: array, items: { type: integer } }
        username: { type: string }
        password: { type: string, description: "Write-only; omit to keep, empty string to clear" }
        port_map: { type: object, additionalProperties: { type: integer } }
        authorized: { type: boolean, description: You own the device or are allowed to capture it (RN-17) }
    Program:
      type: object
      required: [program_id, version, name, vendors, steps, source]
      properties:
        program_id: { type: string }
        version: { type: string }
        name: { type: string }
        vendors: { type: array, items: { type: string } }
        steps: { type: integer }
        source: { type: string, enum: [builtin, installed] }
        signature: { type: string }
    Capture:
      type: object
      required: [id, device_id, program, status, created_at]
      properties:
        id: { type: string }
        device_id: { type: string }
        job_id: { type: string }
        program: { type: string }
        status: { type: string, enum: [running, done, failed] }
        draft_profile_id: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        result:
          type: object
          required: [program, fixtures, steps, ok]
          properties:
            program: { type: string }
            vendor: { type: string }
            steps: { type: integer }
            ok: { type: integer }
            fixtures:
              type: array
              items: { $ref: "#/components/schemas/Fixture" }
    Fixture:
      type: object
      required: [step_id, kind, status, bytes, at]
      properties:
        step_id: { type: string }
        kind: { type: string, enum: [http, rtsp, event] }
        method: { type: string }
        port: { type: integer }
        path: { type: string }
        query: { type: object, additionalProperties: { type: string } }
        status: { type: integer }
        content_type: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: string }
        binary: { type: boolean }
        bytes: { type: integer }
        stream: { type: string }
        vary: { type: array, items: { type: string } }
        at: { type: string, format: date-time }
        error: { type: string }
    Found:
      type: object
      required: [host, via, open_ports, services]
      properties:
        host: { type: string }
        via: { type: string, enum: [sweep, ssdp, ws-discovery, mdns] }
        open_ports: { type: array, items: { type: integer } }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }
        vendor: { type: string }
        server: { type: string }
        url: { type: string }
    Service:
      type: object
      required: [port, proto]
      properties:
        port: { type: integer }
        proto: { type: string }
        server: { type: string }
        auth: { type: string }
        note: { type: string }
    Detected:
      type: object
      required: [at, open_ports, services, reachable]
      properties:
        at: { type: string, format: date-time }
        reachable: { type: boolean }
        open_ports: { type: array, items: { type: integer } }
        vendor: { type: string }
        model: { type: string }
        firmware: { type: string }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }
    Plugin:
      type: object
      required: [id, package_id, package, engine, version, role, permissions, sockets, emits, signature_status, sha256, enabled, installed_at]
      properties:
        id: { type: string }
        package_id: { type: string }
        package: { type: string, description: The package's id, such as examples/hello }
        engine: { type: string }
        version: { type: string }
        role: { type: string, enum: [server, client] }
        permissions:
          type: array
          items: { type: string, enum: [net.listen, net.connect, accounts.read, state.read, state.write, events.emit, events.deliver, media.read, sd] }
        sockets:
          type: array
          items:
            type: object
            required: [name, network, default_port]
            properties:
              name: { type: string }
              network: { type: string, enum: [tcp, udp] }
              default_port: { type: integer }
        emits: { type: array, items: { type: string } }
        signature_status: { type: string, enum: [official, trusted, unsigned, invalid] }
        signer: { type: string }
        sha256: { type: string }
        enabled: { type: boolean }
        approved_by: { type: string, description: Who enabled it last, approving its permissions }
        approved_at: { type: string, format: date-time }
        installed_at: { type: string, format: date-time }
    RouteStat:
      type: object
      required: [route, client_ip, count, errors, auth_failures, p50_ms, p95_ms, max_ms, interval_ms, first_at, last_at]
      properties:
        route: { type: string, description: "The profile's route id; rtsp:METHOD for RTSP; auth for a challenge, auth-failed for credentials refused" }
        client_ip: { type: string }
        count: { type: integer }
        errors: { type: integer, description: Answers of 400 or more, but a challenge's 401 }
        auth_failures: { type: integer }
        p50_ms: { type: number }
        p95_ms: { type: number }
        max_ms: { type: number }
        interval_ms: { type: number, description: How often the client asks, on average }
        first_at: { type: string, format: date-time }
        last_at: { type: string, format: date-time }
    RequestsView:
      type: object
      required: [since, routes, minutes]
      properties:
        since: { type: string, format: date-time }
        routes: { type: array, items: { $ref: "#/components/schemas/RouteStat" } }
        minutes:
          type: array
          items:
            type: object
            required: [minute, count, errors, auth_failures]
            properties:
              minute: { type: string, format: date-time }
              count: { type: integer }
              errors: { type: integer }
              auth_failures: { type: integer }
    CameraClient:
      type: object
      required: [ip, protocols, connected, first_seen, last_seen, connections, mean_session_ms, max_session_ms, requests, errors, auth_failures, gaps, routes]
      properties:
        ip: { type: string }
        protocols: { type: array, items: { type: string } }
        connected: { type: boolean }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        connections: { type: integer, description: Connections it opened; a client that keeps reconnecting opens many }
        mean_session_ms: { type: integer }
        max_session_ms: { type: integer }
        requests: { type: integer }
        errors: { type: integer }
        auth_failures: { type: integer }
        gaps: { type: integer }
        routes: { type: array, items: { $ref: "#/components/schemas/RouteStat" } }
    Gap:
      type: object
      required: [protocol, summary, client_ip, count, first_at, last_at]
      properties:
        protocol: { type: string }
        summary: { type: string, description: "The request, such as GET /cgi-bin/unknown.cgi?action=x" }
        client_ip: { type: string }
        count: { type: integer }
        first_at: { type: string, format: date-time }
        last_at: { type: string, format: date-time }
    CameraLog:
      type: object
      required: [id, at, level, source, msg, attrs]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
        source: { type: string, enum: [camera, service] }
        msg: { type: string }
        attrs: { type: object, additionalProperties: true }
    TrustedKey:
      type: object
      required: [name, key_id, public_key, builtin]
      properties:
        id: { type: string, description: Empty for an official key }
        name: { type: string }
        key_id: { type: string }
        public_key: { type: string }
        builtin: { type: boolean, description: An official catalog key of this build }
        added_at: { type: string, format: date-time }
    UpgradeItem:
      type: object
      required: [key, action]
      properties:
        key: { type: string }
        action: { type: string, enum: [kept, default, reset, added, dropped] }
        value: {}
        reason: { type: string }
    UpgradePlan:
      type: object
      required: [profile_id, from, to, changes, params, protocols, streams, rules, triggers, restart]
      properties:
        profile_id: { type: string }
        from: { type: string }
        to: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/ProfileChange" } }
        params: { type: array, items: { $ref: "#/components/schemas/UpgradeItem" } }
        protocols: { type: array, items: { $ref: "#/components/schemas/UpgradeItem" } }
        streams: { type: array, items: { $ref: "#/components/schemas/UpgradeItem" } }
        rules: { type: array, items: { $ref: "#/components/schemas/UpgradeItem" } }
        triggers: { type: array, items: { $ref: "#/components/schemas/UpgradeItem" } }
        restart: { type: boolean }
    SelfTestResult:
      type: object
      required: [id, covers, status]
      properties:
        id: { type: string }
        file: { type: string }
        covers: { type: string, description: "route:<instance>/<id>, request:<method> <path> or event:<type>" }
        status: { type: string, enum: [passed, failed, skipped] }
        detail: { type: string }
    ProfileStream:
      type: object
      required: [name, codecs, resolutions, fps_min, fps_max, default]
      properties:
        name: { type: string }
        codecs: { type: array, items: { type: string } }
        resolutions: { type: array, items: { type: string } }
        fps_min: { type: integer }
        fps_max: { type: integer }
        bitrate_min: { type: integer }
        bitrate_max: { type: integer }
        default:
          type: object
          required: [codec, resolution, fps, bitrate, gop]
          properties:
            codec: { type: string }
            resolution: { type: string }
            fps: { type: integer }
            bitrate: { type: integer }
            gop: { type: integer }
    ProfileDetail:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [streams, engines, events, event_specs, vca, factory_users, params]
          properties:
            streams: { type: array, items: { $ref: "#/components/schemas/ProfileStream" } }
            engines:
              type: array
              items:
                type: object
                required: [instance, engine]
                properties:
                  instance: { type: string }
                  engine: { type: string }
                  port: { type: integer }
            events: { type: array, items: { type: string } }
            event_specs:
              description: Each event type; without transports cameras cannot emit it.
              type: array
              items:
                type: object
                required: [type, vendor_name, min_interval_ms, transports, rule, report]
                properties:
                  type: { type: string }
                  vendor_name: { type: string }
                  min_interval_ms: { type: integer }
                  transports: { type: array, items: { type: string } }
                  rule: { type: string, enum: [line, region, ""], description: The kind of rule the event comes from; empty for none }
                  report: { type: boolean, description: The event carries counts, not an object }
            vca:
              description: The kinds of rule of the profile's analytics and the objects they detect.
              type: object
              required: [rules, object_classes]
              properties:
                rules: { type: array, items: { type: string, enum: [line, region] } }
                object_classes: { type: array, items: { type: string } }
            factory_users: { type: array, items: { $ref: "#/components/schemas/CameraUser" } }
            factory_ip: { type: string }
            params: { type: array, items: { $ref: "#/components/schemas/Param" } }
            report: { $ref: "#/components/schemas/ImportReport" }
    ImportProblem:
      type: object
      required: [step, severity, message]
      properties:
        step: { type: string }
        severity: { type: string, enum: [error, warning] }
        file: { type: string }
        line: { type: integer }
        pointer: { type: string }
        message: { type: string }
    ImportReport:
      type: object
      required: [kind, id, version, sha256, signature, steps, problems]
      properties:
        kind: { type: string }
        id: { type: string }
        version: { type: string }
        sha256: { type: string }
        signature: { type: string }
        signer: { type: string }
        key_id: { type: string, description: The minisign key ID of any signature, trusted or not }
        level: { type: string }
        coverage: { type: object, additionalProperties: { type: string }, description: What the author declares }
        self_test:
          description: The replay of the package's fixtures against an ephemeral camera of the profile (D88)
          type: object
          required: [results, passed, failed, skipped]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/SelfTestResult" } }
            passed: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
        verified:
          description: "Every route (route:<instance>/<id>) and event (event:<type>): verified, failed or declared"
          type: object
          additionalProperties: { type: string, enum: [verified, failed, declared] }
        steps:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [passed, failed, skipped, pending] }
              note: { type: string }
        problems: { type: array, items: { $ref: "#/components/schemas/ImportProblem" } }
    ImportResult:
      type: object
      required: [report, created]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        plugin: { $ref: "#/components/schemas/Plugin" }
        program: { $ref: "#/components/schemas/Program" }
        report: { $ref: "#/components/schemas/ImportReport" }
        created: { type: boolean }
        job_id: { type: string, description: The import job, with the steps in its history }
    Job:
      type: object
      required: [id, type, title, status, progress, step, question, result, error, created_by, created_at, started_at, finished_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [rendition, import, renditions.prepare] }
        title: { type: string }
        status: { type: string, enum: [queued, running, waiting, completed, failed, canceled, interrupted] }
        progress: { type: number, minimum: 0, maximum: 1 }
        step: { type: string }
        question:
          description: The decision the job waits for; unanswered, it takes the default when it expires
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/JobQuestion"
        result: { type: object, additionalProperties: true }
        error: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    JobQuestion:
      type: object
      required: [id, text, options, default, expires_at]
      properties:
        id: { type: string }
        text: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        default: { type: string }
        expires_at: { type: string, format: date-time }
    JobEvent:
      type: object
      required: [job_id, seq, at, kind, data]
      properties:
        job_id: { type: string }
        seq: { type: integer }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [status, step, log, question, answer] }
        data: { type: object, additionalProperties: true }
    JobDetail:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required: [events]
          properties:
            events: { type: array, items: { $ref: "#/components/schemas/JobEvent" } }
    JobPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: string }
    JobInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [renditions.prepare] }
        params:
          type: object
          properties:
            asset_id: { type: string, description: Only the renditions of this image }
    CameraUser:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { type: string }
    CameraStatus:
      type: object
      required: [state, reason, started_at, last_heartbeat, retries, pending_restart]
      properties:
        state: { type: string, enum: [stopped, provisioning, starting, running, degraded, restarting, stopping, error] }
        reason_code:
          type: string
          description: >
            A stable word for the reason, which the panel explains in the
            user's language: ip_in_use, mac_in_use, no_interface,
            parent_busy, unsupported, invalid, dhcp_waiting,
            dhcp_no_factory, dhcp_factory_in_use, stream, config, launch,
            exited, no_hello, not_ready, config_rejected, camera_failed,
            no_heartbeat, admission, lease_restart or lease_lost. New codes
            may come; show reason when the code is unknown.
        reason: { type: string, description: The reason in English }
        started_at: { type: [string, "null"], format: date-time }
        last_heartbeat: { type: [string, "null"], format: date-time }
        netns: { type: string }
        pid: { type: integer }
        retries: { type: integer }
        ip: { type: string, description: The address the camera holds, or last held }
        ip_source: { type: string, enum: [static, dhcp, factory], description: "factory: DHCP found no server and the camera took the profile's address (D24)" }
        mac: { type: string, description: "The MAC it answers with while running: its own, or the node's with ipvlan" }
        firewall: { type: boolean, description: Its outbound firewall is in place }
        pending_restart:
          description: Saved changes a running camera applies when it restarts (RN-09).
          type: array
          items: { type: string, enum: [network, protocols] }
    Protocol:
      type: object
      required: [instance, engine, role, enabled, port, default_port]
      properties:
        instance: { type: string }
        engine: { type: string }
        role: { type: string, enum: [server, client] }
        enabled: { type: boolean }
        port: { type: integer }
        default_port: { type: integer }
    Endpoint:
      type: object
      required: [instance, engine, protocol, port, url]
      properties:
        instance: { type: string }
        engine: { type: string }
        protocol: { type: string }
        port: { type: integer }
        url: { type: string }
    Stream:
      type: object
      required: [name, codec, resolution, fps, gop, bitrate, asset_id, rendition_status]
      properties:
        name: { type: string, enum: [main, sub, third] }
        url: { type: string, description: RTSP URL of the stream, when an RTSP protocol serves it }
        codec: { type: string, enum: [h264, h265, mjpeg] }
        resolution: { type: string }
        fps: { type: integer }
        gop: { type: integer }
        bitrate: { type: integer }
        asset_id: { type: string }
        rendition_id: { type: string }
        rendition_status: { type: string, enum: [pending, ready, failed, missing] }
        rendition_error: { type: string }
    CameraMetrics:
      type: object
      required: [at, cpu_percent, rss_bytes, clients, bytes_in, bytes_out, requests]
      properties:
        at: { type: string, format: date-time }
        cpu_percent: { type: number }
        rss_bytes: { type: integer }
        clients: { type: integer }
        bytes_in: { type: integer }
        bytes_out: { type: integer }
        requests: { type: integer }
    Network:
      type: object
      required: [mode, parent, mac, ip_mode, ip, netmask, prefix, gateway, dns, force]
      properties:
        mode: { type: string, enum: [macvlan, ipvlan] }
        parent: { type: string }
        mac: { type: string }
        ip_mode: { type: string, enum: [static, dhcp] }
        ip: { type: string }
        netmask: { type: string }
        prefix: { type: integer }
        gateway: { type: string }
        dns: { type: array, items: { type: string } }
        force: { type: boolean }
    Camera:
      type: object
      required: [id, name, profile, serial, desired_state, autostart, tags, network, status, endpoints, protocols, streams, users, targets, rules, triggers, event_types, metrics, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        profile:
          type: object
          required: [id, version, name, vendor, model, level]
          properties:
            id: { type: string }
            version: { type: string }
            name: { type: string }
            vendor: { type: string }
            model: { type: string }
            level: { type: string }
        serial: { type: string }
        desired_state: { type: string, enum: [running, stopped] }
        autostart: { type: boolean }
        tags: { type: array, items: { type: string } }
        network: { $ref: "#/components/schemas/Network" }
        status: { $ref: "#/components/schemas/CameraStatus" }
        endpoints: { type: array, items: { $ref: "#/components/schemas/Endpoint" } }
        protocols: { type: array, items: { $ref: "#/components/schemas/Protocol" } }
        streams: { type: array, items: { $ref: "#/components/schemas/Stream" } }
        users: { type: array, items: { $ref: "#/components/schemas/CameraUser" } }
        targets:
          type: array
          items:
            type: object
            required: [id, name, event_types]
            properties:
              id: { type: string }
              name: { type: string }
              event_types: { type: array, items: { type: string } }
        rules: { type: array, items: { $ref: "#/components/schemas/Rule" } }
        triggers: { type: array, items: { $ref: "#/components/schemas/Trigger" } }
        event_types:
          description: The events the camera can send, as its profile declares them.
          type: array
          items:
            type: object
            required: [type, rule, report]
            properties:
              type: { type: string }
              rule: { type: string, enum: [line, region, ""], description: The kind of rule the event comes from; empty for none }
              report: { type: boolean }
        metrics: { oneOf: [{ $ref: "#/components/schemas/CameraMetrics" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCamera:
      type: object
      required: [name, profile_id, profile_version]
      properties:
        name: { type: string }
        profile_id: { type: string }
        profile_version: { type: string }
        network: { $ref: "#/components/schemas/NetworkInput" }
        users: { type: array, items: { $ref: "#/components/schemas/CameraUserInput" } }
        stream:
          type: object
          description: The main stream; sub and third start from the profile defaults with the same picture.
          properties:
            asset_id: { type: string }
            codec: { type: string, enum: [h264, h265, mjpeg] }
            resolution: { type: string }
            fps: { type: integer }
        target_ids: { type: array, items: { type: string } }
        autostart: { type: boolean }
        start: { type: boolean }
        tags: { type: array, items: { type: string } }
    UpdateCamera:
      type: object
      properties:
        name: { type: string }
        autostart: { type: boolean }
        tags: { type: array, items: { type: string } }
        target_ids: { type: array, items: { type: string } }
        network:
          description: The whole network identity; a running camera applies it when it restarts (RN-09).
          allOf: [{ $ref: "#/components/schemas/NetworkInput" }]
    NetworkInput:
      type: object
      description: >
        Empty fields take the node's defaults. When editing, an empty MAC
        keeps the current one and default_mac goes back to the one derived
        from the camera ID; an empty mode or ip_mode and a missing force keep
        theirs. No DNS servers means the node's (or the lease's with DHCP).
      properties:
        mode:
          type: string
          enum: [macvlan, ipvlan]
          description: "macvlan (default): the camera's own MAC. ipvlan: the node's MAC, for Wi-Fi and switches that limit MACs (D27)"
        ip_mode:
          type: string
          enum: [static, dhcp]
          description: "dhcp: the camera leases its address, and takes the profile's factory one when no server answers (D24). Not with ipvlan"
        force:
          type: boolean
          description: Start even if another device answers on the camera's IP or MAC (D14); off by default
        parent: { type: string }
        mac: { type: string }
        default_mac: { type: boolean }
        vendor_oui: { type: boolean }
        ip: { type: string }
        netmask: { type: string }
        gateway: { type: string }
        dns: { type: array, items: { type: string }, maxItems: 3 }
    CameraUserInput:
      type: object
      required: [username]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true, description: Required for a new account; empty keeps the current one. }
        role: { type: string, enum: [admin, operator, viewer] }
    CloneCamera:
      type: object
      required: [name]
      properties:
        name: { type: string }
        network: { $ref: "#/components/schemas/NetworkInput" }
        start: { type: boolean }
    Param:
      type: object
      required: [key, type, value, default, effective, origin, updated_at]
      properties:
        key: { type: string }
        type: { type: string, enum: [string, int, float, bool, enum] }
        value: {}
        default: {}
        values: { type: array, items: {} }
        min: { type: number }
        max: { type: number }
        bind: { type: string }
        effective: { type: boolean }
        description: { type: string }
        origin: { type: string }
        updated_at: { type: string, format: date-time }
    ParamList:
      type: object
      required: [params]
      properties:
        params: { type: array, items: { $ref: "#/components/schemas/Param" } }
    Asset:
      type: object
      required: [id, filename, mime, width, height, size, sha256, builtin, camera_count, created_at]
      properties:
        id: { type: string }
        filename: { type: string }
        mime: { type: string }
        width: { type: integer }
        height: { type: integer }
        size: { type: integer }
        sha256: { type: string }
        builtin: { type: boolean }
        camera_count: { type: integer }
        created_at: { type: string, format: date-time }
    Target:
      description: >
        An event receiver shared by cameras (D45). Which fields apply depends
        on its type: http (method, headers, auth), mqtt (topic, client_id,
        insecure), ftp and sftp (host_key), smtp (tls, from, to, insecure).
      type: object
      required: [id, name, type, url, method, headers, username, has_password, enabled, camera_count, created_at, to, insecure]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/TargetType" }
        url: { type: string, description: "http(s)://, mqtt(s)://host[:port], ftp://host[:port]/dir, sftp://host[:port]/dir or smtp(s)://host[:port]" }
        method: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        username: { type: string }
        has_password: { type: boolean }
        enabled: { type: boolean }
        camera_count: { type: integer }
        created_at: { type: string, format: date-time }
        auth: { type: string, enum: [basic, digest], description: "http: Basic, or Digest answering the target's challenge" }
        topic: { type: string, description: "mqtt: template replacing the profile's topic" }
        client_id: { type: string, description: "mqtt: template replacing the profile's client ID" }
        host_key: { type: string, description: "sftp: SHA256 fingerprint the server key must have; empty accepts any" }
        tls: { type: string, enum: [none, starttls, tls] }
        from: { type: string }
        to: { type: array, items: { type: string } }
        insecure: { type: boolean, description: "mqtts and smtp: accept a TLS certificate that does not verify" }
        delivery: { $ref: "#/components/schemas/DeliveryOverride" }
    TargetType:
      type: string
      enum: [http, mqtt, ftp, sftp, smtp]
    DeliveryOverride:
      description: The target's own delivery policy; what it leaves out comes from the profile (D42). An empty object goes back to the profile's.
      type: object
      properties:
        timeout_ms: { type: integer, minimum: 100, maximum: 120000 }
        retries: { type: integer, minimum: 0, maximum: 10 }
        backoff_ms: { type: integer, minimum: 0, maximum: 600000 }
    TargetInput:
      type: object
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/TargetType" }
        url: { type: string }
        method: { type: string, enum: [GET, POST, PUT] }
        headers: { type: object, additionalProperties: { type: string } }
        username: { type: string }
        password: { type: string, writeOnly: true }
        enabled: { type: boolean }
        auth: { type: string, enum: [basic, digest] }
        topic: { type: string }
        client_id: { type: string }
        host_key: { type: string }
        tls: { type: string, enum: [none, starttls, tls] }
        from: { type: string }
        to: { type: array, items: { type: string }, maxItems: 5 }
        insecure: { type: boolean }
        delivery: { $ref: "#/components/schemas/DeliveryOverride" }
    TargetTest:
      type: object
      description: >
        The test leaves from a running camera that uses the target, across
        the same network as its deliveries; with none running it leaves from
        the node, which refuses its own and link-local addresses. An http
        target gets a request; an mqtt one a session; ftp and sftp a login
        and the target's directory, created if missing; smtp the sender and
        recipients, without any mail.
      required: [ok, latency_ms, from]
      properties:
        ok: { type: boolean }
        http_status: { type: integer }
        latency_ms: { type: integer }
        error: { type: string }
        from: { type: string, enum: [camera, node] }
        camera: { type: string, description: Name of the camera the request left from }
    FaultKind:
      type: string
      enum: [service_down, latency, error_status, clock_skew, network_down, ip_conflict, sd_missing, sd_error, sd_read_only, sd_full]
      description: >
        service_down: a protocol resets its connections and refuses new
        ones. latency: everything a protocol reads waits latency_ms.
        error_status: every request of the HTTP API or RTSP gets status
        (401 with a challenge). clock_skew: the camera's clock moves skew_s.
        network_down: the camera answers nobody, not even ARP, and reaches
        nobody; it raises network_lost. ip_conflict: it raises ip_conflict.
        sd_missing, sd_error, sd_read_only and sd_full force the SD card's
        state (cameras with a card only) and raise storage_missing,
        storage_failure or storage_full; the card records nothing meanwhile,
        and a missing or failing one cannot be searched.
    FaultInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/FaultKind" }
        instance: { type: string, description: "The protocol's engine instance, as the profile names it (service_down, latency, error_status)" }
        status: { type: integer, enum: [401, 403, 404, 500, 503] }
        latency_ms: { type: integer, minimum: 1, maximum: 30000 }
        skew_s: { type: integer, description: Seconds the clock moves; not 0, at most a year either way }
        duration_s: { type: integer, minimum: 0, maximum: 86400, description: 0 lasts until ended by hand }
    Fault:
      type: object
      required: [id, camera_id, kind, started_at, expires_at, ended_at, created_by, active]
      properties:
        id: { type: string }
        camera_id: { type: string }
        camera_name: { type: string }
        kind: { $ref: "#/components/schemas/FaultKind" }
        instance: { type: string }
        status: { type: integer }
        latency_ms: { type: integer }
        skew_s: { type: integer }
        started_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        ended_by: { type: string, description: "expired, replaced, or who ended it" }
        created_by: { type: string }
        active: { type: boolean }
    StorageStatus:
      type: object
      required: [kind, state, capacity_bytes, used_bytes, files, overwrite]
      properties:
        kind: { type: string, enum: [none, sd, nas] }
        state: { type: string, enum: ["", present, full, absent, error, read_only], description: Empty when the camera records nothing }
        capacity_bytes: { type: integer, description: The card's size; 0 for a share }
        used_bytes: { type: integer }
        files: { type: integer }
        overwrite: { type: boolean }
    Storage:
      type: object
      required: [kind, size_mb, overwrite, nas_url, nas_username, has_nas_password, max_sd_mb, nas_protocols, status, records]
      properties:
        kind: { type: string, enum: [none, sd, nas] }
        size_mb: { type: integer, description: The card's capacity, its quota on the node }
        overwrite: { type: boolean, description: "A full card replaces its oldest recordings (D69); off, it stops recording and raises storage_full" }
        nas_url: { type: string }
        nas_username: { type: string }
        has_nas_password: { type: boolean }
        max_sd_mb: { type: integer, description: Largest card the profile's model takes; 0 without a slot }
        nas_protocols: { type: array, items: { type: string, enum: [nfs, smb] } }
        status: { $ref: "#/components/schemas/StorageStatus" }
        nas_error: { type: string, description: Why the camera cannot reach its share }
        records:
          description: The events the profile records, and what
          type: array
          items:
            type: object
            required: [event, snapshot, clip_s, stream]
            properties:
              event: { type: string }
              snapshot: { type: boolean }
              clip_s: { type: integer }
              stream: { type: string }
    StorageInput:
      type: object
      properties:
        kind: { type: string, enum: [none, sd, nas] }
        size_mb: { type: integer, minimum: 64, description: "Up to the model's largest card; 1024 or the largest when a card is new" }
        overwrite: { type: boolean }
        nas_url: { type: string, description: "nfs://host[:port]/export[?uid=N&gid=N] or smb://host[:port]/share[/dir]" }
        nas_username: { type: string, maxLength: 128, description: "SMB account, DOMAIN\\user for a domain one" }
        nas_password: { type: string, maxLength: 256, description: Replaces the share's password; empty clears it }
    Recording:
      type: object
      required: [id, name, kind, event_type, size, start, end, location]
      properties:
        id: { type: string }
        name: { type: string, description: "Its path on the card or the share, as 20261007/143000_motion_x7k2pq.ts" }
        kind: { type: string, enum: [snapshot, clip] }
        stream: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        size: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        location: { type: string, enum: [sd, nas] }
    Point:
      description: A position on the picture, from 0 to 1 from its top left corner.
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    Rule:
      description: >
        A VCA rule (D39). A line has two points; its side A is on the left
        walking from the first to the second, and direction says which
        crossings it reports. A region has 3 to 20 points. Events are what the
        rule reports, among the events its profile raises from its kind of
        rule. No object_classes means every class of the profile.
      type: object
      required: [id, name, type, points, direction, events, object_classes, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [line, region] }
        points: { type: array, items: { $ref: "#/components/schemas/Point" } }
        direction: { type: string, enum: ["A->B", "B->A", both, ""] }
        events: { type: array, items: { type: string } }
        object_classes: { type: array, items: { type: string } }
        enabled: { type: boolean }
    RuleInput:
      type: object
      required: [name, type, points]
      properties:
        id: { type: string, description: An existing rule of the camera; empty for a new one }
        name: { type: string, maxLength: 32 }
        type: { type: string, enum: [line, region] }
        points: { type: array, minItems: 2, maxItems: 20, items: { $ref: "#/components/schemas/Point" } }
        direction: { type: string, enum: ["A->B", "B->A", both], description: Lines only; both by default }
        events: { type: array, items: { type: string }, description: Required for regions; a line without events reports line_crossing }
        object_classes: { type: array, items: { type: string } }
        enabled: { type: boolean, default: true }
    Analytics:
      type: object
      required: [since, lines, regions, events]
      properties:
        since: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [rule_id, name, a_to_b, b_to_a, classes]
            properties:
              rule_id: { type: string }
              name: { type: string }
              a_to_b: { type: integer }
              b_to_a: { type: integer }
              classes:
                type: object
                additionalProperties:
                  type: object
                  required: [a_to_b, b_to_a]
                  properties:
                    a_to_b: { type: integer }
                    b_to_a: { type: integer }
        regions:
          type: array
          items:
            type: object
            required: [rule_id, name, entries, exits, occupancy, events]
            properties:
              rule_id: { type: string }
              name: { type: string }
              entries: { type: integer }
              exits: { type: integer }
              occupancy: { type: integer, description: Entries minus exits, never below zero }
              events: { type: object, additionalProperties: { type: integer } }
        events: { type: object, additionalProperties: { type: integer } }
        heat:
          description: Objects seen in each cell, row by row from the top left corner.
          type: object
          required: [cols, rows, cells]
          properties:
            cols: { type: integer }
            rows: { type: integer }
            cells: { type: array, items: { type: integer } }
    SpeedRange:
      type: object
      required: [min, max, limit, unit]
      properties:
        min: { type: number, minimum: 0 }
        max: { type: number, maximum: 500 }
        limit: { type: number, description: 0 for none }
        unit: { type: string, enum: [km/h, mph] }
    Trigger:
      description: >
        A stored trigger (D40). A random one emits an event of event_type on
        rule_id (empty: any enabled rule that reports the type) at a random
        moment between min_seconds and max_seconds after the previous one,
        while it is enabled and the camera runs. Plates and plate_masks (9 a
        digit, A a letter, X a hex digit, backslash escapes) give its events
        a plate, and speed a speed.
      type: object
      required: [id, name, type, event_type, rule_id, min_seconds, max_seconds, plates, plate_masks, speed, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [random] }
        event_type: { type: string }
        rule_id: { type: string }
        min_seconds: { type: integer }
        max_seconds: { type: integer }
        plates: { type: array, items: { type: string } }
        plate_masks: { type: array, items: { type: string } }
        speed: { oneOf: [{ $ref: "#/components/schemas/SpeedRange" }, { type: "null" }] }
        enabled: { type: boolean }
    TriggerInput:
      type: object
      required: [name, event_type, min_seconds, max_seconds]
      properties:
        id: { type: string, description: An existing trigger of the camera; empty for a new one }
        name: { type: string, maxLength: 32 }
        type: { type: string, enum: [random], default: random }
        event_type: { type: string }
        rule_id: { type: string }
        min_seconds: { type: integer, minimum: 1, maximum: 86400 }
        max_seconds: { type: integer, minimum: 1, maximum: 86400 }
        plates: { type: array, maxItems: 100, items: { type: string, maxLength: 16 } }
        plate_masks: { type: array, maxItems: 10, items: { type: string } }
        speed: { oneOf: [{ $ref: "#/components/schemas/SpeedRange" }, { type: "null" }] }
        enabled: { type: boolean, default: true }
    ManualEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, examples: [line_crossing] }
        rule_id: { type: string }
        direction: { type: string, enum: ["A->B", "B->A", none] }
        object:
          type: object
          required: [class]
          properties:
            class: { type: string }
            color: { type: string }
            confidence: { type: number }
        plate:
          type: object
          required: [text]
          properties:
            text: { type: string }
            format: { type: string }
            color: { type: string }
        speed:
          type: object
          required: [value, unit]
          properties:
            value: { type: number }
            unit: { type: string }
            limit: { type: number }
        custom: { type: object, additionalProperties: true }
    Delivery:
      type: object
      required: [id, event_id, target_id, target_name, attempt, at, status, latency_ms]
      properties:
        id: { type: string }
        event_id: { type: string }
        target_id: { type: string }
        target_name: { type: string }
        attempt: { type: integer }
        at: { type: string, format: date-time }
        status: { type: string, enum: [ok, retry, failed, skipped], description: "skipped: the camera chose not to send, as a mail within its interval" }
        http_status: { type: integer }
        latency_ms: { type: integer }
        error: { type: string }
    Event:
      type: object
      required: [id, camera_id, camera_name, type, at, data, deliveries, delivery_status, latency_ms]
      properties:
        id: { type: string }
        camera_id: { type: string }
        camera_name: { type: string }
        type: { type: string }
        at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
        rule_id: { type: string, description: The camera's rule behind the event }
        trigger_id: { type: string, description: The camera's stored trigger behind the event }
        deliveries: { type: array, items: { $ref: "#/components/schemas/Delivery" } }
        delivery_status: { type: string, enum: [ok, failed, pending, skipped, none] }
        latency_ms: { type: [integer, "null"] }
    EventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        next_cursor: { type: string }
